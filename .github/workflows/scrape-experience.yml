name: Scrape Tibia Experience

# Runs twice a day, at 00:00 and 12:00 UTC. The 12:00 run (13:00 Lisbon in
# summer, 12:00 in winter) is the effective one — comfortably after the 09:00
# Lisbon server save, when guildstats.eu publishes the previous day's XP
# (~10:50 UTC). The 00:00 run (01:00 Lisbon) is before that save, so the
# script's Europe/Lisbon time gate (isAfterLisbonServerSave, hour >= 9) cleanly
# skips it — a no-op success kept as a light redundancy slot. guildstats serves
# ~30 days and the scraper appends every date it doesn't already have, so a
# single missed run is backfilled by the next one. Public repo (unlimited
# Actions minutes); each real run takes ~20-30s.
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run scraper (3 personagens)
        run: node scripts/scrape-experience.mjs
        env:
          # workflow_dispatch (manual runs) always scrape, ignoring the time-of-day check.
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Run scraper (jogadores da Equipa)
        run: node scripts/scrape-team-experience.mjs
        env:
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Commit updated history
        run: |
          git config user.name "tibia-xp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scraped-history data/team-history
          if git diff --cached --quiet; then
            echo "Sem alterações a commitar."
          else
            git commit -m "chore: atualizar histórico de XP ($(date -u +%Y-%m-%d))"
            git push
          fi
